<div class="flex min-h-screen flex-col">
  <app-header />
  <main class="flex-1">
    @switch (nav.view()) {
      @case ('home') {
        <app-home />
      }
      @case ('product-list') {
        <app-product-list />
      }
      @case ('product-detail') {
        <app-product-detail />
      }
      @case ('cart') {
        <app-cart />
      }
    }
  </main>
  <app-footer />
</div>
