<button type="button" class="group block w-full text-left text-ink" (click)="open()">
  <div class="relative flex aspect-square items-center justify-center bg-soft-cloud">
    @if (isNew()) {
      <div class="absolute left-sm top-sm">
        <app-badge label="Just In" />
      </div>
    }
    @if (image(); as src) {
      <img [src]="src" [alt]="product().name" class="h-[70%] w-[70%] object-contain" loading="lazy" />
    }
  </div>

  @if (colors().length > 0) {
    <div class="mt-sm flex items-center gap-xs">
      @for (color of colors(); track $index) {
        <app-swatch-dot [color]="color" />
      }
    </div>
  }

  <p class="mt-sm line-clamp-2 text-body-strong font-medium">{{ product().name }}</p>
  <p class="mt-xxs text-caption text-mute">{{ category() }}</p>

  <div class="mt-sm flex items-center gap-xs">
    @if (showsFromPrice()) {
      <span class="text-caption text-mute">Desde</span>
    }
    <span class="text-body-strong font-medium text-ink">{{ price() | currency }}</span>
  </div>
</button>
