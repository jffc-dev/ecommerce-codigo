<button
  type="button"
  class="rounded-full border px-lg py-sm text-button-sm font-medium transition-all duration-200 motion-safe:active:scale-95"
  [ngClass]="active() ? 'bg-ink text-on-primary border-ink hover:bg-charcoal' : 'bg-canvas text-ink border-hairline hover:border-ink'"
  [attr.aria-pressed]="active()"
  (click)="toggle()"
>
  {{ label() }}
</button>
